<title>Aimo-avtal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: sticky top bar (title + live progress + generate action),
     then one long scrolling page of section cards mirroring the
     contract's own structure, two-column on wide screens. Palette drawn
     from the real template's header banner (lavender -> dusty rose). */
  :root {
    --bg: #faf9fb;
    --surface: #ffffff;
    --surface-2: #f3f0f6;
    --fg: #231f28;
    --fg-muted: #6b6475;
    --border: #e2dce8;
    --accent: #7c5a96;
    --accent-fg: #ffffff;
    --accent-soft: #efe7f3;
    --rose: #c98a93;
    --warn-bg: #fdf3e3;
    --warn-fg: #7a4d12;
    --warn-border: #f0ce9a;
    --ok: #3f8f5f;
    --shadow: 0 1px 2px rgba(35, 31, 40, 0.06), 0 4px 16px rgba(35, 31, 40, 0.05);
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1720;
      --surface: #241e29;
      --surface-2: #2c2531;
      --fg: #f1ecf4;
      --fg-muted: #ad9fb8;
      --border: #3a3242;
      --accent: #b79bcf;
      --accent-fg: #211a27;
      --accent-soft: #332a3c;
      --rose: #d9a3ab;
      --warn-bg: #3a2f17;
      --warn-fg: #f2cf8e;
      --warn-border: #5c4820;
      --ok: #7cc79a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1720;
    --surface: #241e29;
    --surface-2: #2c2531;
    --fg: #f1ecf4;
    --fg-muted: #ad9fb8;
    --border: #3a3242;
    --accent: #b79bcf;
    --accent-fg: #211a27;
    --accent-soft: #332a3c;
    --rose: #d9a3ab;
    --warn-bg: #3a2f17;
    --warn-fg: #f2cf8e;
    --warn-border: #5c4820;
    --ok: #7cc79a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 920px; margin: 0 auto; padding-block: 0 48px; }

  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
    padding-block: 14px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .topbar-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topbar h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(20px, 3.2vw, 26px);
    margin: 0;
    flex: 1 1 auto;
    min-width: 0;
  }
  .progress-chip {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    white-space: nowrap;
  }
  .progress-chip b { color: var(--fg); }
  .subtitle { margin: 2px 0 0; color: var(--fg-muted); font-size: 13.5px; }

  .generate-btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .generate-btn:hover { filter: brightness(1.06); }
  .generate-btn:active { filter: brightness(0.96); }
  .generate-btn:disabled { opacity: 0.6; cursor: wait; }

  .example-btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  .example-btn:hover { background: var(--accent-soft); }

  section.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 20px 20px;
    margin-bottom: 16px;
  }
  section.card h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 14px;
    text-wrap: balance;
  }
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px 18px;
  }
  .field { min-width: 0; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 5px;
    color: var(--fg);
  }
  .field .hint { font-weight: 400; color: var(--fg-muted); }
  .field input[type="text"] {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14.5px;
    font-variant-numeric: tabular-nums;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--fg);
  }
  .field input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .field input[type="text"].flagged { border-color: var(--rose); }

  .radio-row, .check-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
  .radio-opt, .check-opt { display: flex; align-items: center; gap: 6px; font-size: 14.5px; }
  input[type="radio"], input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }

  .warnings {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-fg);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .warnings h3 { margin: 0 0 8px; font-size: 15px; font-family: var(--font-display); }
  .warnings ul { margin: 0 0 12px; padding-left: 20px; }
  .warnings li { margin-bottom: 3px; }
  .warnings .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-secondary, .btn-ghost {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid var(--warn-border);
  }
  .btn-secondary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn-ghost { background: transparent; color: var(--warn-fg); }

  .status-banner {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-size: 14.5px;
    display: none;
  }
  .status-banner.show { display: block; }
  .status-banner.ok { background: var(--accent-soft); border: 1px solid var(--accent); }
  .status-banner.error { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-fg); }
  .status-banner code { font-family: ui-monospace, monospace; font-size: 13px; }

  .footnote { color: var(--fg-muted); font-size: 12.5px; margin: 4px 0 0; }

  @media (max-width: 560px) {
    .topbar-row { gap: 10px; }
    .generate-btn { padding: 10px 14px; font-size: 14px; }
    section.card { padding: 16px; }
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1>Aimo-avtal</h1>
        <p class="subtitle">Fyll i fälten nedan - avtalet formateras precis som originalmallen</p>
      </div>
      <span class="progress-chip" id="progressChip"><b id="progressCount">0</b> / <span id="progressTotal">0</span> fält ifyllda</span>
      <button class="example-btn" id="exampleBtn" type="button">Fyll i exempel</button>
      <button class="generate-btn" id="generateBtn" type="button">Generera avtal</button>
    </div>
  </div>

  <div class="status-banner" id="statusBanner"></div>
  <div class="warnings" id="warningsPanel" style="display:none"></div>

  <form id="contractForm"></form>

  <p class="footnote" id="loadStatus">Laddar mall...</p>
</div>

  var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var NUMERIC_RE = /^[\d\s.,]+$/;

  function validateValue(kind, label, value) {
    value = (value || "").trim();
    if (kind === "text") return value ? null : label + " är tomt";
    if (kind === "email") {
      if (!value) return label + " är tomt";
      return EMAIL_RE.test(value) ? null : label + ": ser inte ut som en e-postadress (“" + value + "”)";
    }
    if (kind === "numeric") {
      if (!value) return label + " är tomt";
      return NUMERIC_RE.test(value) ? null : label + ": bör bara innehålla siffror (“" + value + "”)";
    }
    if (kind === "date") {
      if (!value) return label + " är tomt";
      return DATE_RE.test(value) ? null : label + ": bör vara i formatet ÅÅÅÅ-MM-DD (“" + value + "”)";
    }
    return null;
  }

  // ---- build the form ----
  var formEl = document.getElementById("contractForm");

  var radioGroupCount = 0;

    var grid = document.createElement("div");
    grid.className = "field-grid";

    section.fields.forEach(function (f) {
      var wrap = document.createElement("div");
      wrap.className = "field";

      if (f.kind === "radio") {

        legend.textContent = f.label;

        var row = document.createElement("div");
        row.className = "radio-row";

          inp.addEventListener("change", updateProgress);
          lab.appendChild(inp);
          lab.appendChild(document.createTextNode(optLabel));
          row.appendChild(lab);

        wrap.appendChild(row);
      } else if (f.kind === "checkbox") {

        lab2.appendChild(inp2);
        lab2.appendChild(document.createTextNode(" " + f.label));
        wrap.appendChild(lab2);
      } else {
        textFieldCount++;
        var label3 = document.createElement("label");
        label3.setAttribute("for", "f_" + f.id);
        label3.textContent = f.label;
        if (f.hint) {
          var hintSpan = document.createElement("span");
          hintSpan.className = "hint";
          hintSpan.textContent = "  (" + f.hint + ")";
          label3.appendChild(hintSpan);
        }
        wrap.appendChild(label3);

        inp3.type = "text";
        inp3.id = "f_" + f.id;
        inp3.dataset.kind = f.kind;
        inp3.dataset.label = f.label;
        inp3.addEventListener("input", updateProgress);
        wrap.appendChild(inp3);
      }

      grid.appendChild(wrap);
    });

    card.appendChild(grid);
    formEl.appendChild(card);

  function updateProgress() {
    var filled = 0;
    SECTIONS.forEach(function (section) {
      section.fields.forEach(function (f) {
        if (f.kind === "radio") {
          if (document.querySelector('input[name="' + f.id + '"]:checked')) filled++;
        } else if (f.kind !== "checkbox") {
          var el = document.getElementById("f_" + f.id);
          if (el && el.value.trim()) filled++;
        }
      });
    });
    document.getElementById("progressCount").textContent = filled;
  }

  function collectData() {
    var data = {};
    SECTIONS.forEach(function (section) {
      section.fields.forEach(function (f) {
        if (f.kind === "radio") {
          var checked = document.querySelector('input[name="' + f.id + '"]:checked');
          f.options.forEach(function (opt) { data[opt[0]] = checked ? checked.value === opt[0] : false; });
        } else if (f.kind === "checkbox") {
          data[f.id] = document.getElementById("f_" + f.id).checked;
        } else {
          var v = document.getElementById("f_" + f.id).value.trim();
          if (v) data[f.id] = v;
        }
      });
    });
    return data;
  }

  function collectWarnings() {
    var warnings = [];
    SECTIONS.forEach(function (section) {
      section.fields.forEach(function (f) {
        if (f.kind === "radio") {
          var checked = document.querySelector('input[name="' + f.id + '"]:checked');
          if (!checked) warnings.push(f.label + ": inget alternativ valt");
        } else if (f.kind !== "checkbox") {
          var el = document.getElementById("f_" + f.id);
          var msg = validateValue(f.kind, f.label, el.value);
          el.classList.toggle("flagged", Boolean(msg));
          if (msg) warnings.push(msg);
        }
      });
    });
    return warnings;
  }

  function fillDocumentXml(xmlText, data) {
    var parser = new DOMParser();
    var xmlDoc = parser.parseFromString(xmlText, "application/xml");
    var parseErrorEl = xmlDoc.getElementsByTagName("parsererror")[0];
    if (parseErrorEl) {
      var detail = (parseErrorEl.textContent || "").replace(/\s+/g, " ").trim().slice(0, 300);
      var preview = xmlText.slice(0, 120);
      throw new Error(
        "Kunde inte tolka mallens XML (" + xmlText.length + " tecken, börjar med " +
        JSON.stringify(preview) + "): " + detail
      );
    }
    var sdts = xmlDoc.getElementsByTagNameNS(W_NS, "sdt");
    var unfilled = [];

    FIELDS.forEach(function (f) {
      var sdt = sdts[f.sdtIndex];
      if (!sdt) throw new Error("Mallen saknar fält " + f.sdtIndex);
      var content = sdt.getElementsByTagNameNS(W_NS, "sdtContent")[0];
      var ts = content.getElementsByTagNameNS(W_NS, "t");
      if (ts.length === 0) throw new Error("Fält " + f.id + " saknar textnod");

      if (f.kind === "text") {
        var hasValue = Object.prototype.hasOwnProperty.call(data, f.id) && data[f.id] !== "";
        var value = hasValue ? String(data[f.id]) : f.default;
        ts[0].textContent = value;
        for (var i = 1; i < ts.length; i++) ts[i].textContent = "";
        if (!hasValue) unfilled.push(f.id);
      } else {
        var checked = Boolean(data[f.id]);
        ts[0].textContent = checked ? CHECKED : UNCHECKED;
        for (var j = 1; j < ts.length; j++) ts[j].textContent = "";
        var checkboxEl = sdt.getElementsByTagNameNS(W14_NS, "checkbox")[0];
        if (checkboxEl) {
          var checkedEl = checkboxEl.getElementsByTagNameNS(W14_NS, "checked")[0];
          if (checkedEl) checkedEl.setAttributeNS(W14_NS, "w14:val", checked ? "1" : "0");
        }
      }
    });

    var serialized = new XMLSerializer().serializeToString(xmlDoc);
    return { xml: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + serialized, unfilled: unfilled };
  }

  // The Artifact host only serves a fixed set of file types to pages, and
  // .docx isn't one of them, so the template ships embedded as base64
  // right in the page instead of as a separate fetched file.
  function base64ToArrayBuffer(base64) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  var TEMPLATE_EXPECTED_BYTES = 255125;

  var templateZipPromise = Promise.resolve(TEMPLATE_DOCX_BASE64)
    .then(base64ToArrayBuffer)
    .then(function (buf) {
      if (buf.byteLength !== TEMPLATE_EXPECTED_BYTES) {
        throw new Error(
          "Mallen laddades med fel storlek (" + buf.byteLength + " byte, väntade " +
          TEMPLATE_EXPECTED_BYTES + "). Mallens base64-sträng var " + TEMPLATE_DOCX_BASE64.length + " tecken."
        );
      }
      return buf;
    })
    .then(function (buf) { return JSZip.loadAsync(buf); })
    .then(function (zip) {
      if (!zip.file("word/document.xml")) {
        throw new Error("Mallen saknar word/document.xml (" + Object.keys(zip.files).length + " filer hittades).");
      }
      document.getElementById("loadStatus").textContent = "Mallen är laddad. Fyll i fälten och klicka på “Generera avtal”.";
      return zip;
    })
    .catch(function (err) {
      document.getElementById("loadStatus").textContent = "Kunde inte ladda mallen: " + err.message + ". Ladda om sidan.";
      throw err;
    });

  function showStatus(kind, html) {
    var el = document.getElementById("statusBanner");
    el.className = "status-banner show " + kind;
    el.innerHTML = html;
  }

  function showWarnings(warnings) {
    var panel = document.getElementById("warningsPanel");
    var max = 15;
    var shown = warnings.slice(0, max);
    var more = warnings.length - shown.length;
    var html = "<h3>" + warnings.length + " fält kan behöva ses över</h3><ul>" +
      shown.map(function (w) { return "<li>" + w.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</li>"; }).join("") +
      "</ul>";
    if (more > 0) html += "<p>... och " + more + " till</p>";
    html += '<div class="actions"><button class="btn-secondary" id="proceedAnyway" type="button">Fortsätt ändå och generera</button>' +
      '<button class="btn-ghost" id="reviewFields" type="button">Granska fälten</button></div>';
    panel.innerHTML = html;
    panel.style.display = "block";
    try { panel.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) { /* non-fatal */ }

    document.getElementById("proceedAnyway").addEventListener("click", function () {
      panel.style.display = "none";
      runGenerate(true);
    });
    document.getElementById("reviewFields").addEventListener("click", function () {
      panel.style.display = "none";
    });
  }

  function runGenerate(skipWarnings) {
    document.getElementById("warningsPanel").style.display = "none";
    if (!skipWarnings) {
      var warnings = collectWarnings();
      if (warnings.length > 0) {
        showWarnings(warnings);
        return;
      }
    }

    var btn = document.getElementById("generateBtn");
    btn.disabled = true;
    btn.textContent = "Genererar...";

    var data = collectData();

    Promise.all([templateZipPromise, claudeUse("downloads")])
      .then(function (results) {
        var zip = results[0];
        var downloads = results[1];
        if (!downloads) throw { code: "unavailable", message: "Nedladdning är inte tillgänglig i den här vyn." };

        return zip.file("word/document.xml").async("string").then(function (xmlText) {
          var result = fillDocumentXml(xmlText, data);
          zip.file("word/document.xml", result.xml);
          return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" })
            .then(function (blob) {
              return downloads.save({ filename: "avtal.docx", data: blob }).then(function () {
                return result.unfilled;
              });
            });
        });
      })
      .then(function (unfilled) {
        var html = "Word-dokumentet är sparat. Öppna det i Microsoft Word och använd " +
          "<b>Arkiv &gt; Spara som &gt; PDF</b> (eller <b>Exportera &gt; Skapa PDF/XPS</b>) för att få PDF:en.";
        if (unfilled.length > 0) {
          html += "<br><br>" + unfilled.length + " fält lämnades med mallens platshållare (XXX/XX/DATUM) eftersom de inte fylldes i.";
        }
        showStatus("ok", html);
      })
      .catch(function (err) {
        var msg = (err && err.message) ? err.message : String(err);
        if (err && err.code === "declined") {
          showStatus("error", "Nedladdningen avbröts.");
        } else {
          showStatus("error", "Kunde inte generera avtalet: <code>" + msg.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</code>");
        }
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "Generera avtal";
      });
  }

  function claudeUse(name) {
    if (window.claude && typeof window.claude.use === "function") {
      return window.claude.use(name);
    }
    return Promise.resolve(null);
  }
