<title>Aimo-avtal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: sticky top bar (title + live progress + generate action),
     then one long scrolling page of section cards mirroring the
     contract's own structure, two-column on wide screens. Palette drawn
     from the real template's header banner (lavender -> dusty rose). */
  :root {
    --bg: #faf9fb;
    --surface: #ffffff;
    --surface-2: #f3f0f6;
    --fg: #231f28;
    --fg-muted: #6b6475;
    --border: #e2dce8;
    --accent: #7c5a96;
    --accent-fg: #ffffff;
    --accent-soft: #efe7f3;
    --rose: #c98a93;
    --warn-bg: #fdf3e3;
    --warn-fg: #7a4d12;
    --warn-border: #f0ce9a;
    --ok: #3f8f5f;
    --shadow: 0 1px 2px rgba(35, 31, 40, 0.06), 0 4px 16px rgba(35, 31, 40, 0.05);
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1720;
      --surface: #241e29;
      --surface-2: #2c2531;
      --fg: #f1ecf4;
      --fg-muted: #ad9fb8;
      --border: #3a3242;
      --accent: #b79bcf;
      --accent-fg: #211a27;
      --accent-soft: #332a3c;
      --rose: #d9a3ab;
      --warn-bg: #3a2f17;
      --warn-fg: #f2cf8e;
      --warn-border: #5c4820;
      --ok: #7cc79a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1720;
    --surface: #241e29;
    --surface-2: #2c2531;
    --fg: #f1ecf4;
    --fg-muted: #ad9fb8;
    --border: #3a3242;
    --accent: #b79bcf;
    --accent-fg: #211a27;
    --accent-soft: #332a3c;
    --rose: #d9a3ab;
    --warn-bg: #3a2f17;
    --warn-fg: #f2cf8e;
    --warn-border: #5c4820;
    --ok: #7cc79a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 920px; margin: 0 auto; padding-block: 0 48px; }

  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
    padding-block: 14px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .topbar-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topbar h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(20px, 3.2vw, 26px);
    margin: 0;
    flex: 1 1 auto;
    min-width: 0;
  }
  .progress-chip {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    white-space: nowrap;
  }
  .progress-chip b { color: var(--fg); }
  .subtitle { margin: 2px 0 0; color: var(--fg-muted); font-size: 13.5px; }

  .generate-btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .generate-btn:hover { filter: brightness(1.06); }
  .generate-btn:active { filter: brightness(0.96); }
  .generate-btn:disabled { opacity: 0.6; cursor: wait; }

  .example-btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  .example-btn:hover { background: var(--accent-soft); }

  .active-template-name { font-size: 13.5px; font-weight: 600; color: var(--fg-muted); white-space: nowrap; }

  .view-tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .tab-btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13.5px;
    background: transparent;
    color: var(--fg-muted);
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn.active { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

  .save-panel {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 18px;
  }
  .save-panel label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .save-panel-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .save-panel-row input[type="text"] {
    flex: 1 1 240px;
    font-family: var(--font-body);
    font-size: 14.5px;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--fg);
  }

  .template-picker {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .template-picker[hidden] { display: none; }
  .template-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .template-card h3 { margin: 0 0 6px; font-size: 16px; }
  .template-card p { margin: 0 0 14px; }
  .template-card button { width: 100%; }

  .contracts-header, .contract-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1.3fr 0.8fr auto;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
  }
  .contracts-header {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .contract-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .contract-name { font-weight: 600; }
  .contract-type, .contract-updated { color: var(--fg-muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .status-pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-pill.status-draft { background: var(--surface-2); color: var(--fg-muted); border: 1px solid var(--border); }
  .status-pill.status-final { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  .contract-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .contract-actions .btn-ghost, .contract-actions .btn-secondary { border-color: var(--border); color: var(--fg); padding: 6px 12px; font-size: 13px; }
  .contract-actions .btn-secondary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .confirm-text { font-size: 13px; color: var(--fg-muted); }

  @media (max-width: 700px) {
    .contracts-header { display: none; }
    .contract-row { grid-template-columns: 1fr; gap: 4px; }
    .contract-actions { justify-content: flex-start; }
  }

  section.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 20px 20px;
    margin-bottom: 16px;
  }
  section.card h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 14px;
    text-wrap: balance;
  }
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px 18px;
  }
  .field { min-width: 0; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 5px;
    color: var(--fg);
  }
  .field .hint { font-weight: 400; color: var(--fg-muted); }
  .field input[type="text"], .field select {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14.5px;
    font-variant-numeric: tabular-nums;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--fg);
  }
  .field input[type="text"]:focus, .field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .field input[type="text"].flagged { border-color: var(--rose); }

  .radio-row, .check-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
  .radio-opt, .check-opt { display: flex; align-items: center; gap: 6px; font-size: 14.5px; }
  input[type="radio"], input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }

  .warnings {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-fg);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .warnings h3 { margin: 0 0 8px; font-size: 15px; font-family: var(--font-display); }
  .warnings ul { margin: 0 0 12px; padding-left: 20px; }
  .warnings li { margin-bottom: 3px; }
  .warnings .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-secondary, .btn-ghost {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid var(--warn-border);
  }
  .btn-secondary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn-ghost { background: transparent; color: var(--warn-fg); }

  .status-banner {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-size: 14.5px;
    display: none;
  }
  .status-banner.show { display: block; }
  .status-banner.ok { background: var(--accent-soft); border: 1px solid var(--accent); }
  .status-banner.error { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-fg); }
  .status-banner code { font-family: ui-monospace, monospace; font-size: 13px; }

  .footnote { color: var(--fg-muted); font-size: 12.5px; margin: 4px 0 0; }

  @media (max-width: 560px) {
    .topbar-row { gap: 10px; }
    .generate-btn { padding: 10px 14px; font-size: 14px; }
    section.card { padding: 16px; }
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1>Aimo-avtal</h1>
        <p class="subtitle">Fyll i fälten nedan - avtalet formateras precis som originalmallen</p>
      </div>
      <div class="view-tabs">
        <button class="tab-btn active" id="tabFormBtn" type="button">Formulär</button>
        <button class="tab-btn" id="tabListBtn" type="button">Mina avtal</button>
      </div>
      <span class="active-template-name" id="activeTemplateName"></span>
      <button class="example-btn" id="switchTemplateBtn" type="button">Byt avtalstyp</button>
      <span class="progress-chip" id="progressChip"><b id="progressCount">0</b> / <span id="progressTotal">0</span> fält ifyllda</span>
      <button class="example-btn" id="newContractBtn" type="button" hidden>Nytt avtal</button>
      <button class="example-btn" id="saveDraftBtn" type="button">Spara utkast</button>
      <button class="example-btn" id="exampleBtn" type="button">Fyll i exempel</button>
      <button class="generate-btn" id="generateBtn" type="button">Generera avtal</button>
    </div>
  </div>

  <div id="formView">
    <div id="templatePicker" class="template-picker"></div>

    <div id="templateFormArea">
      <div class="save-panel" id="savePanel" hidden>
        <label for="saveNameInput">Namn på avtalet</label>
        <div class="save-panel-row">
          <input type="text" id="saveNameInput" placeholder="t.ex. Exempelfastigheter AB - 2026-01-01">
          <button class="btn-secondary" id="confirmSaveBtn" type="button">Spara</button>
          <button class="btn-ghost" id="cancelSaveBtn" type="button">Avbryt</button>
        </div>
      </div>

      <div class="status-banner" id="statusBanner"></div>
      <div class="warnings" id="warningsPanel" style="display:none"></div>

      <form id="contractForm"></form>

      <p class="footnote" id="loadStatus">Laddar mall...</p>
    </div>
  </div>

  <div id="listView" hidden>
    <p class="footnote" id="standaloneNotice" hidden>Körs utanför Claude: utkasten sparas bara lokalt i den här webbläsaren, inte delade med kollegor.</p>
    <div class="contracts-header">
      <span>Namn</span><span>Typ</span><span>Senast ändrad</span><span>Status</span><span></span>
    </div>
    <div id="contractsList"></div>
  </div>
</div>

  function activeTemplate() { return TEMPLATES[currentTemplateId]; }

  var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var NUMERIC_RE = /^[\d\s.,]+$/;

  function validateValue(kind, label, value) {
    value = (value || "").trim();
    if (kind === "text") return value ? null : label + " är tomt";
    if (kind === "email") {
      if (!value) return label + " är tomt";
      return EMAIL_RE.test(value) ? null : label + ": ser inte ut som en e-postadress (“" + value + "”)";
    }
    if (kind === "numeric") {
      if (!value) return label + " är tomt";
      return NUMERIC_RE.test(value) ? null : label + ": bör bara innehålla siffror (“" + value + "”)";
    }
    if (kind === "date") {
      if (!value) return label + " är tomt";
      return DATE_RE.test(value) ? null : label + ": bör vara i formatet ÅÅÅÅ-MM-DD (“" + value + "”)";
    }
    return null;
  }

  // ---- build the form (callable per template, Phase 3 of the roadmap) ----
  var formEl = document.getElementById("contractForm");

  function buildForm(sections) {
    formEl.innerHTML = "";
    ACTIVE_SECTIONS = sections;
    var textFieldCount = 0;
    var radioGroupCount = 0;

    sections.forEach(function (section) {
      var card = document.createElement("section");
      card.className = "card";
      var h2 = document.createElement("h2");
      h2.textContent = section.title;
      card.appendChild(h2);
      var grid = document.createElement("div");
      grid.className = "field-grid";

      section.fields.forEach(function (f) {
        var wrap = document.createElement("div");
        wrap.className = "field";

        if (f.kind === "radio") {
          radioGroupCount++;
          var legend = document.createElement("label");
          legend.textContent = f.label;
          wrap.appendChild(legend);
          var row = document.createElement("div");
          row.className = "radio-row";
          f.options.forEach(function (opt) {
            var optId = opt[0], optLabel = opt[1];
            var lab = document.createElement("label");
            lab.className = "radio-opt";
            var inp = document.createElement("input");
            inp.type = "radio";
            inp.name = f.id;
            inp.value = optId;
            inp.id = "f_" + optId;
            inp.addEventListener("change", updateProgress);
            lab.appendChild(inp);
            lab.appendChild(document.createTextNode(optLabel));
            row.appendChild(lab);
          });
          wrap.appendChild(row);
        } else if (f.kind === "checkbox") {
          var lab2 = document.createElement("label");
          lab2.className = "check-opt";
          lab2.style.marginTop = "4px";
          var inp2 = document.createElement("input");
          inp2.type = "checkbox";
          inp2.id = "f_" + f.id;
          lab2.appendChild(inp2);
          lab2.appendChild(document.createTextNode(" " + f.label));
          wrap.appendChild(lab2);
        } else if (f.kind === "select") {
          textFieldCount++;
          var label4 = document.createElement("label");
          label4.setAttribute("for", "f_" + f.id);
          label4.textContent = f.label;
          wrap.appendChild(label4);
          var sel = document.createElement("select");
          sel.id = "f_" + f.id;
          sel.dataset.kind = f.kind;
          sel.dataset.label = f.label;
          f.options.forEach(function (optText) {
            var optEl = document.createElement("option");
            optEl.value = optText;
            optEl.textContent = optText;
            sel.appendChild(optEl);
          });
          sel.addEventListener("change", updateProgress);
          wrap.appendChild(sel);
        } else {
          textFieldCount++;
          var label3 = document.createElement("label");
          label3.setAttribute("for", "f_" + f.id);
          label3.textContent = f.label;
          if (f.hint) {
            var hintSpan = document.createElement("span");
            hintSpan.className = "hint";
            hintSpan.textContent = "  (" + f.hint + ")";
            label3.appendChild(hintSpan);
          }
          wrap.appendChild(label3);
          var inp3 = document.createElement("input");
          inp3.type = "text";
          inp3.id = "f_" + f.id;
          inp3.dataset.kind = f.kind;
          inp3.dataset.label = f.label;
          inp3.addEventListener("input", updateProgress);
          wrap.appendChild(inp3);
        }

        grid.appendChild(wrap);
      });

      card.appendChild(grid);
      formEl.appendChild(card);
    });

    document.getElementById("progressTotal").textContent = textFieldCount + radioGroupCount;
    updateProgress();
  }

  function updateProgress() {
    if (!ACTIVE_SECTIONS) return;
    var filled = 0;
    ACTIVE_SECTIONS.forEach(function (section) {
      section.fields.forEach(function (f) {
        if (f.kind === "radio") {
          if (document.querySelector('input[name="' + f.id + '"]:checked')) filled++;
        } else if (f.kind !== "checkbox") {
          var el = document.getElementById("f_" + f.id);
          if (el && el.value.trim()) filled++;
        }
      });
    });
    document.getElementById("progressCount").textContent = filled;
  }

  function collectData() {
    var data = {};
    if (!ACTIVE_SECTIONS) return data;
    ACTIVE_SECTIONS.forEach(function (section) {
      section.fields.forEach(function (f) {
        if (f.kind === "radio") {
          var checked = document.querySelector('input[name="' + f.id + '"]:checked');
          f.options.forEach(function (opt) { data[opt[0]] = checked ? checked.value === opt[0] : false; });
        } else if (f.kind === "checkbox") {
          data[f.id] = document.getElementById("f_" + f.id).checked;
        } else {
          var v = document.getElementById("f_" + f.id).value.trim();
          if (v) data[f.id] = v;
        }
      });
    });
    return data;
  }

  function collectWarnings() {
    var warnings = [];
    if (!ACTIVE_SECTIONS) return warnings;
    ACTIVE_SECTIONS.forEach(function (section) {
      section.fields.forEach(function (f) {
        if (f.kind === "radio") {
          var checked = document.querySelector('input[name="' + f.id + '"]:checked');
          if (!checked) warnings.push(f.label + ": inget alternativ valt");
        } else if (f.kind !== "checkbox") {
          var el = document.getElementById("f_" + f.id);
          var msg = validateValue(f.kind, f.label, el.value);
          el.classList.toggle("flagged", Boolean(msg));
          if (msg) warnings.push(msg);
        }
      });
    });
    return warnings;
  }

  function parseTemplateXml(xmlText) {
    // JSZip's .async("string") decodes a UTF-8 byte-order mark (if the
    // template's document.xml has one, as the Arrendeavtal template does)
    // into a literal U+FEFF character ahead of "<?xml ...?>" - browsers'
    // DOMParser rejects that as a second XML declaration rather than
    // treating it as an encoding marker, so strip it before parsing.
    if (xmlText.charCodeAt(0) === 0xFEFF) xmlText = xmlText.slice(1);
    var parser = new DOMParser();
    var xmlDoc = parser.parseFromString(xmlText, "application/xml");
    var parseErrorEl = xmlDoc.getElementsByTagName("parsererror")[0];
    if (parseErrorEl) {
      var detail = (parseErrorEl.textContent || "").replace(/\s+/g, " ").trim().slice(0, 300);
      var preview = xmlText.slice(0, 120);
      throw new Error(
        "Kunde inte tolka mallens XML (" + xmlText.length + " tecken, börjar med " +
        JSON.stringify(preview) + "): " + detail
      );
    }
    return xmlDoc;
  }

  function serializeXml(xmlDoc) {
    var serialized = new XMLSerializer().serializeToString(xmlDoc);
    // The browser's serializer already re-emits the source document's own
    // <?xml ...?> declaration (since the template's document.xml has one) -
    // strip it before adding ours, or the output ends up with two
    // declarations back to back, which strict XML parsers (LibreOffice
    // among them) reject outright.
    serialized = serialized.replace(/^<\?xml[^>]*\?>\s*/, "");
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + serialized;
  }

  // Edits native Word content controls (<w:sdt>), addressed by position
  // (sdtIndex) among all such elements in word/document.xml.
  function fillSdt(xmlText, data, fields) {
    var xmlDoc = parseTemplateXml(xmlText);
    var sdts = xmlDoc.getElementsByTagNameNS(W_NS, "sdt");
    var unfilled = [];

    fields.forEach(function (f) {
      var sdt = sdts[f.sdtIndex];
      if (!sdt) throw new Error("Mallen saknar fält " + f.sdtIndex);
      var content = sdt.getElementsByTagNameNS(W_NS, "sdtContent")[0];
      var ts = content.getElementsByTagNameNS(W_NS, "t");
      if (ts.length === 0) throw new Error("Fält " + f.id + " saknar textnod");

      if (f.kind === "text") {
        var hasValue = Object.prototype.hasOwnProperty.call(data, f.id) && data[f.id] !== "";
        var value = hasValue ? String(data[f.id]) : f.default;
        ts[0].textContent = value;
        for (var i = 1; i < ts.length; i++) ts[i].textContent = "";
        if (!hasValue) unfilled.push(f.id);
      } else {
        var checked = Boolean(data[f.id]);
        ts[0].textContent = checked ? CHECKED : UNCHECKED;
        for (var j = 1; j < ts.length; j++) ts[j].textContent = "";
        var checkboxEl = sdt.getElementsByTagNameNS(W14_NS, "checkbox")[0];
        if (checkboxEl) {
          var checkedEl = checkboxEl.getElementsByTagNameNS(W14_NS, "checked")[0];
          if (checkedEl) checkedEl.setAttributeNS(W14_NS, "w14:val", checked ? "1" : "0");
        }
      }
    });

    return { xml: serializeXml(xmlDoc), unfilled: unfilled };
  }

  // Edits legacy Word "Form Fields" (FORMTEXT/FORMCHECKBOX/FORMDROPDOWN),
  // addressed by position (index) among all such fields in
  // word/document.xml - see FIELDS_ARRENDE's comment for why position is
  // used instead of the field's own (mostly non-unique) w:name.
  function fillFormText(xmlText, data, fields) {
    var xmlDoc = parseTemplateXml(xmlText);

    // Walk every <w:r> in document order, grouping the runs between a
    // "begin" and "end" fldChar into one slot per legacy field, in the
    // same order they appear in the template.
    var allRuns = xmlDoc.getElementsByTagNameNS(W_NS, "r");
    var slots = [];
    var current = null;
    for (var i = 0; i < allRuns.length; i++) {
      var run = allRuns[i];
      var fldChars = run.getElementsByTagNameNS(W_NS, "fldChar");
      if (fldChars.length > 0) {
        var fld = fldChars[0];
        var ftype = fld.getAttributeNS(W_NS, "fldCharType");
        if (ftype === "begin") {
          var ffDatas = fld.getElementsByTagNameNS(W_NS, "ffData");
          var ffData = ffDatas[0] || null;
          current = {
            checkBoxEl: ffData ? ffData.getElementsByTagNameNS(W_NS, "checkBox")[0] || null : null,
            ddListEl: ffData ? ffData.getElementsByTagNameNS(W_NS, "ddList")[0] || null : null,
            resultTextNodes: []
          };
        } else if (ftype === "end") {
          if (current) slots.push(current);
          current = null;
        }
        continue;
      }
      if (current) {
        var ts = run.getElementsByTagNameNS(W_NS, "t");
        for (var k = 0; k < ts.length; k++) current.resultTextNodes.push(ts[k]);
      }
    }

    function setSlotText(slot, value) {
      if (slot.resultTextNodes.length === 0) throw new Error("Fältet saknar textnod i mallen");
      slot.resultTextNodes[0].textContent = value;
      for (var n = 1; n < slot.resultTextNodes.length; n++) slot.resultTextNodes[n].textContent = "";
    }
    function setSlotChecked(slot, checked) {
      if (!slot.checkBoxEl) throw new Error("Fältet är inte en kryssruta i mallen");
      var checkedEl = slot.checkBoxEl.getElementsByTagNameNS(W_NS, "checked")[0];
      if (!checkedEl) {
        checkedEl = xmlDoc.createElementNS(W_NS, "w:checked");
        slot.checkBoxEl.appendChild(checkedEl);
      }
      checkedEl.setAttributeNS(W_NS, "w:val", checked ? "1" : "0");
    }
    function setSlotDropdown(slot, index) {
      if (!slot.ddListEl) throw new Error("Fältet är inte en dropdown i mallen");
      var resultEl = slot.ddListEl.getElementsByTagNameNS(W_NS, "result")[0];
      if (!resultEl) {
        resultEl = xmlDoc.createElementNS(W_NS, "w:result");
        slot.ddListEl.appendChild(resultEl);
      }
      resultEl.setAttributeNS(W_NS, "w:val", String(index));
    }

    var unfilled = [];
    fields.forEach(function (f) {
      var slot = slots[f.index];
      if (!slot) throw new Error("Mallen saknar fält " + f.index);

      if (f.kind === "text") {
        var hasValue = Object.prototype.hasOwnProperty.call(data, f.id) && data[f.id] !== "";
        var value = hasValue ? String(data[f.id]) : f.default;
        setSlotText(slot, value);
        if (!hasValue) unfilled.push(f.id);
      } else if (f.kind === "checkbox") {
        setSlotChecked(slot, Boolean(data[f.id]));
      } else if (f.kind === "dropdown") {
        var chosen = Object.prototype.hasOwnProperty.call(data, f.id) ? data[f.id] : f.default;
        var idx = f.opts.indexOf(chosen);
        setSlotDropdown(slot, idx >= 0 ? idx : 0);
      }

      (f.blankPositions || []).forEach(function (bp) {
        var extraSlot = slots[bp];
        if (extraSlot) setSlotText(extraSlot, "");
      });
    });

    return { xml: serializeXml(xmlDoc), unfilled: unfilled };
  }

  function fillDocumentXml(xmlText, data, template) {
    return template.mechanism === "formtext"
      ? fillFormText(xmlText, data, template.fields)
      : fillSdt(xmlText, data, template.fields);
  }

  // The Artifact host only serves a fixed set of file types to pages, and
  // .docx isn't one of them, so every template ships embedded as base64
  // right in the page instead of as separately fetched files.
  function base64ToArrayBuffer(base64) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  // Lazily loads and memoizes one template's zip - only the template the
  // user actually picks gets decoded, not all of them up front.
  function getTemplateZip(templateId) {
    if (templateZipPromises[templateId]) return templateZipPromises[templateId];
    var template = TEMPLATES[templateId];
    var promise = Promise.resolve(template.base64)
      .then(base64ToArrayBuffer)
      .then(function (buf) {
        if (buf.byteLength !== template.expectedBytes) {
          throw new Error(
            "Mallen laddades med fel storlek (" + buf.byteLength + " byte, väntade " +
            template.expectedBytes + "). Mallens base64-sträng var " + template.base64.length + " tecken."
          );
        }
        return buf;
      })
      .then(function (buf) { return JSZip.loadAsync(buf); })
      .then(function (zip) {
        if (!zip.file("word/document.xml")) {
          throw new Error("Mallen saknar word/document.xml (" + Object.keys(zip.files).length + " filer hittades).");
        }
        return zip;
      })
      .catch(function (err) {
        delete templateZipPromises[templateId];
        throw err;
      });
    templateZipPromises[templateId] = promise;
    return promise;
  }

  function showStatus(kind, html) {
    var el = document.getElementById("statusBanner");
    el.className = "status-banner show " + kind;
    el.innerHTML = html;
  }

  function showWarnings(warnings) {
    var panel = document.getElementById("warningsPanel");
    var max = 15;
    var shown = warnings.slice(0, max);
    var more = warnings.length - shown.length;
    var html = "<h3>" + warnings.length + " fält kan behöva ses över</h3><ul>" +
      shown.map(function (w) { return "<li>" + w.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</li>"; }).join("") +
      "</ul>";
    if (more > 0) html += "<p>... och " + more + " till</p>";
    html += '<div class="actions"><button class="btn-secondary" id="proceedAnyway" type="button">Fortsätt ändå och generera</button>' +
      '<button class="btn-ghost" id="reviewFields" type="button">Granska fälten</button></div>';
    panel.innerHTML = html;
    panel.style.display = "block";
    try { panel.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) { /* non-fatal */ }

    document.getElementById("proceedAnyway").addEventListener("click", function () {
      panel.style.display = "none";
      runGenerate(true);
    });
    document.getElementById("reviewFields").addEventListener("click", function () {
      panel.style.display = "none";
    });
  }

  function runGenerate(skipWarnings) {
    document.getElementById("warningsPanel").style.display = "none";
    if (!skipWarnings) {
      var warnings = collectWarnings();
      if (warnings.length > 0) {
        showWarnings(warnings);
        return;
      }
    }

    var btn = document.getElementById("generateBtn");
    btn.disabled = true;
    btn.textContent = "Genererar...";

    var data = collectData();
    var template = activeTemplate();

    Promise.all([getTemplateZip(currentTemplateId), claudeUse("downloads")])
      .then(function (results) {
        var zip = results[0];
        var downloads = results[1];
        if (!downloads) throw { code: "unavailable", message: "Nedladdning är inte tillgänglig i den här vyn." };

        return zip.file("word/document.xml").async("string").then(function (xmlText) {
          var result = fillDocumentXml(xmlText, data, template);
          zip.file("word/document.xml", result.xml);
          return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" })
            .then(function (blob) {
              return downloads.save({ filename: template.outputFilename, data: blob }).then(function () {
                // Same field data collectData() already produced for the
                // .docx fill - exported alongside it as JSON so it can be
                // read into an external system (e.g. NetSuite) without
                // re-parsing the Word document.
                var jsonPayload = {
                  templateId: currentTemplateId,
                  templateName: template.name,
                  generatedAt: new Date().toISOString(),
                  fields: data
                };
                var jsonBlob = new Blob([JSON.stringify(jsonPayload, null, 2)], { type: "application/json" });
                var jsonFilename = template.outputFilename.replace(/\.docx$/, ".json");
                return downloads.save({ filename: jsonFilename, data: jsonBlob });
              }).then(function () {
                return result.unfilled;
              });
            });
        });
      })
      .then(function (unfilled) {
        var html = "Word-dokumentet och en JSON-fil med fältvärdena är sparade. Öppna dokumentet i Microsoft Word och använd " +
          "<b>Arkiv &gt; Spara som &gt; PDF</b> (eller <b>Exportera &gt; Skapa PDF/XPS</b>) för att få PDF:en.";
        if (unfilled.length > 0) {
          html += "<br><br>" + unfilled.length + " fält lämnades med mallens platshållare (XXX/XX/DATUM) eftersom de inte fylldes i.";
        }
        if (currentContractId) {
          html += "<br><br>Det sparade utkastet har markerats som klart.";
        }
        showStatus("ok", html);
        markCurrentContractFinal();
      })
      .catch(function (err) {
        var msg = (err && err.message) ? err.message : String(err);
        if (err && err.code === "declined") {
          showStatus("error", "Nedladdningen avbröts.");
        } else {
          showStatus("error", "Kunde inte generera avtalet: <code>" + msg.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</code>");
        }
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "Generera avtal";
      });
  }

  // ---- standalone fallbacks (used only when window.claude is absent) ----
  var localDownloads = {
    save: function (req) {
      try {
        var url = URL.createObjectURL(req.data);
        var a = document.createElement("a");
        a.href = url;
        a.download = req.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        return Promise.resolve({ status: "saved" });
      } catch (err) {
        return Promise.reject(err);
      }
    }
  };

  // Mirrors the subset of the Artifact `db` capability this page actually
  // calls (doc/collection, get/set/update/delete, orderBy+limit+get),
  // persisted to localStorage instead of a shared store. Per-browser only -
  // not shared between colleagues, unlike the Artifact-hosted version.
  function makeLocalDb() {
    var STORAGE_KEY = "aimo_contracts_local_db_v1";
    var autoIdCounter = 0;

    function loadStore() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch (err) {
        return {};
      }
    }
    function saveStore(store) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }
    function makeDocRef(path) {
      var parts = path.split("/");
      var id = parts[parts.length - 1];
      return {
        id: id,
        path: path,
        get: function () {
          var store = loadStore();
          var exists = Object.prototype.hasOwnProperty.call(store, path);
          return Promise.resolve({
            id: id,
            exists: exists,
            data: function () { return exists ? store[path] : undefined; }
          });
        },
        set: function (data) {
          var store = loadStore();
          store[path] = JSON.parse(JSON.stringify(data));
          saveStore(store);
          return Promise.resolve();
        },
        update: function (data) {
          var store = loadStore();
          if (!Object.prototype.hasOwnProperty.call(store, path)) {
            return Promise.reject(new Error("no such document: " + path));
          }
          Object.assign(store[path], JSON.parse(JSON.stringify(data)));
          saveStore(store);
          return Promise.resolve();
        },
        delete: function () {
          var store = loadStore();
          delete store[path];
          saveStore(store);
          return Promise.resolve();
        }
      };
    }
    function makeCollectionRef(collPath) {
      var orderField = null, orderDir = "asc", limitN = null;
      return {
        path: collPath,
        doc: function (id) {
          if (!id) id = "local" + Date.now().toString(36) + (++autoIdCounter).toString(36);
          return makeDocRef(collPath + "/" + id);
        },
        orderBy: function (field, dir) { orderField = field; orderDir = dir || "asc"; return this; },
        limit: function (n) { limitN = n; return this; },
        get: function () {
          var store = loadStore();
          var prefix = collPath + "/";
          var docs = Object.keys(store)
            .filter(function (p) { return p.indexOf(prefix) === 0 && p.slice(prefix.length).indexOf("/") === -1; })
            .map(function (p) {
              var docId = p.slice(prefix.length);
              return { id: docId, exists: true, data: function () { return store[p]; } };
            });
          if (orderField) {
            docs.sort(function (a, b) {
              var av = a.data()[orderField], bv = b.data()[orderField];
              if (av < bv) return orderDir === "desc" ? 1 : -1;
              if (av > bv) return orderDir === "desc" ? -1 : 1;
              return 0;
            });
          }
          if (limitN) docs = docs.slice(0, limitN);
          return Promise.resolve({ docs: docs, size: docs.length, empty: docs.length === 0 });
        }
      };
    }
    return {
      doc: function (path) { return makeDocRef(path); },
      collection: function (path) { return makeCollectionRef(path); }
    };
  }
  var localDb = null;

  function claudeUse(name) {
    if (window.claude && typeof window.claude.use === "function") {
      return window.claude.use(name);
    }
    if (name === "downloads") return Promise.resolve(localDownloads);
    if (name === "db") {
      if (!localDb) localDb = makeLocalDb();
      return Promise.resolve(localDb);
    }
    return Promise.resolve(null);
  }

  // Resets every field to `data` (or blank/unchecked when a field is
  // absent from it) - used both for "Fyll i exempel" and for loading a
  // saved contract back into the form, where stale values from whatever
  // was in the form before must not survive the switch.
  function populateForm(data) {
    ACTIVE_SECTIONS.forEach(function (section) {
      section.fields.forEach(function (f) {
        if (f.kind === "radio") {
          f.options.forEach(function (opt) {
            var r = document.getElementById("f_" + opt[0]);
            if (r) r.checked = false;
          });
          var selected = data[f.id];
          if (selected) {
            var radio = document.getElementById("f_" + selected);
            if (radio) radio.checked = true;
          }
        } else if (f.kind === "checkbox") {
          var cb = document.getElementById("f_" + f.id);
          if (cb) cb.checked = Object.prototype.hasOwnProperty.call(data, f.id) ? Boolean(data[f.id]) : false;
        } else {
          var el = document.getElementById("f_" + f.id);
          if (el) el.value = Object.prototype.hasOwnProperty.call(data, f.id) ? data[f.id] : "";
          if (el) el.classList.remove("flagged");
        }
      });
    });
    document.getElementById("statusBanner").classList.remove("show");
    document.getElementById("warningsPanel").style.display = "none";
    updateProgress();
  }

  function fillWithSampleData() {
    if (currentTemplateId === "aimo_charge_v1_2") {
      populateForm(SAMPLE_DATA);
    } else {
      showStatus("error", "Det finns inget exempel för den här avtalstypen än.");
    }
  }

  // ---- view switching ----
  function setView(view) {
    document.getElementById("formView").hidden = (view !== "form");
    document.getElementById("listView").hidden = (view !== "list");
    document.getElementById("tabFormBtn").classList.toggle("active", view === "form");
    document.getElementById("tabListBtn").classList.toggle("active", view === "list");
    var formActive = view === "form" && Boolean(currentTemplateId);
    document.getElementById("progressChip").hidden = !formActive;
    document.getElementById("exampleBtn").hidden = !formActive;
    document.getElementById("saveDraftBtn").hidden = !formActive;
    document.getElementById("generateBtn").hidden = !formActive;
    document.getElementById("switchTemplateBtn").hidden = !formActive;
    document.getElementById("newContractBtn").hidden = (view !== "list");
    document.getElementById("standaloneNotice").hidden = !(view === "list" && isStandalone);
    if (view === "form") {
      document.getElementById("templatePicker").hidden = Boolean(currentTemplateId);
      document.getElementById("templateFormArea").hidden = !currentTemplateId;
    }
    if (view === "list") refreshContractsList();
  }

  // ---- template selection (Phase 3 of the roadmap) ----
  function activateTemplateForm(templateId) {
    currentTemplateId = templateId;
    var template = TEMPLATES[templateId];
    buildForm(template.sections);
    document.getElementById("activeTemplateName").textContent = template.name;
    document.getElementById("loadStatus").textContent = "Laddar mall...";
    // Re-run the load-status feedback on every activation, even when the
    // zip is already cached from a previous visit to this template -
    // getTemplateZip() only resolves/rejects its promise once, so its own
    // .then()/.catch() wouldn't fire again for a later re-selection.
    getTemplateZip(templateId)
      .then(function () {
        if (currentTemplateId === templateId) {
          document.getElementById("loadStatus").textContent = "Mallen är laddad. Fyll i fälten och klicka på “Generera avtal”.";
        }
      })
      .catch(function (err) {
        if (currentTemplateId === templateId) {
          document.getElementById("loadStatus").textContent = "Kunde inte ladda mallen: " + errMsg(err) + ". Ladda om sidan.";
        }
      });
  }

  function selectTemplate(id) {
    activateTemplateForm(id);
    populateForm({});
    setView("form");
  }

  function switchTemplate() {
    currentTemplateId = null;
    currentContractId = null;
    currentContractCreatedAt = null;
    setView("form");
  }

  function newContract() {
    currentContractId = null;
    currentContractCreatedAt = null;
    currentTemplateId = null;
    setView("form");
  }

  // ---- save/resume (db capability) ----
  function showSavePanel() {
    var panel = document.getElementById("savePanel");
    var nameInput = document.getElementById("saveNameInput");
    if (!nameInput.value) {
      var hintField = activeTemplate().nameHintField;
      var hintEl = hintField ? document.getElementById("f_" + hintField) : null;
      var suggestedName = (hintEl && hintEl.value.trim()) || "Namnlöst avtal";
      nameInput.value = suggestedName + " - " + new Date().toLocaleDateString("sv-SE");
    }
    panel.hidden = false;
    nameInput.focus();
    nameInput.select();
  }

  function hideSavePanel() {
    document.getElementById("savePanel").hidden = true;
  }

  function confirmSaveDraft() {
    var name = document.getElementById("saveNameInput").value.trim();
    if (!name) {
      document.getElementById("saveNameInput").focus();
      return;
    }
    var saveBtn = document.getElementById("confirmSaveBtn");
    saveBtn.disabled = true;

    claudeUse("db").then(function (db) {
      if (!db) {
        showStatus("error", "Kunde inte spara: sparade avtal är inte tillgängligt i den här vyn.");
        return;
      }
      var now = new Date().toISOString();
      var body = {
        name: name,
        templateId: currentTemplateId,
        status: "draft",
        data: collectData(),
        createdAt: currentContractCreatedAt || now,
        updatedAt: now
      };
      var ref = currentContractId ? db.doc("contracts/" + currentContractId) : db.collection("contracts").doc();
      return ref.set(body).then(function () {
        currentContractId = ref.id;
        currentContractCreatedAt = body.createdAt;
        hideSavePanel();
        showStatus("ok", "Utkastet “" + escapeHtml(name) + "” är sparat.");
      });
    }).catch(function (err) {
      showStatus("error", "Kunde inte spara utkastet: " + escapeHtml(errMsg(err)));
    }).finally(function () {
      saveBtn.disabled = false;
    });
  }

  function markCurrentContractFinal() {
    if (!currentContractId) return; // never saved as a draft - nothing to update
    claudeUse("db").then(function (db) {
      if (!db) return;
      return db.doc("contracts/" + currentContractId).update({ status: "final", updatedAt: new Date().toISOString() });
    }).catch(function () { /* non-fatal: the download already succeeded */ });
  }

  function refreshContractsList() {
    var listEl = document.getElementById("contractsList");
    listEl.innerHTML = '<p class="footnote">Laddar...</p>';
    claudeUse("db").then(function (db) {
      if (!db) {
        listEl.innerHTML = '<p class="footnote">Sparade avtal är inte tillgängligt i den här vyn.</p>';
        return;
      }
      return db.collection("contracts").orderBy("updatedAt", "desc").limit(200).get().then(function (snap) {
        cachedContracts = snap.docs.map(function (d) { return { id: d.id, data: d.data() || {} }; });
        pendingDeleteId = null;
        renderContractsList();
      });
    }).catch(function (err) {
      listEl.innerHTML = '<p class="footnote">Kunde inte läsa sparade avtal: ' + escapeHtml(errMsg(err)) + '</p>';
    });
  }

  function renderContractsList() {
    var listEl = document.getElementById("contractsList");
    if (cachedContracts.length === 0) {
      listEl.innerHTML = '<p class="footnote">Inga sparade avtal ännu. Fyll i formuläret och klicka “Spara utkast”.</p>';
      return;
    }
    listEl.innerHTML = "";
    cachedContracts.forEach(function (c) {
      var d = c.data;
      var row = document.createElement("div");
      row.className = "contract-row";
      var statusLabel = d.status === "final" ? "Klar" : "Utkast";
      var updated = d.updatedAt ? new Date(d.updatedAt).toLocaleString("sv-SE", { dateStyle: "medium", timeStyle: "short" }) : "–";
      var typeLabel = (TEMPLATES[d.templateId] && TEMPLATES[d.templateId].name) || d.templateId || "–";

      var actionsHtml;
      if (pendingDeleteId === c.id) {
        actionsHtml =
          '<span class="confirm-text">Ta bort permanent?</span>' +
          '<button class="btn-secondary" data-act="confirm-delete" type="button">Ja, ta bort</button>' +
          '<button class="btn-ghost" data-act="cancel-delete" type="button">Avbryt</button>';
      } else {
        actionsHtml =
          '<button class="btn-ghost" data-act="open" type="button">Öppna</button>' +
          '<button class="btn-ghost" data-act="delete" type="button">Ta bort</button>';
      }

      row.innerHTML =
        '<span class="contract-name">' + escapeHtml(d.name || "(utan namn)") + '</span>' +
        '<span class="contract-type">' + escapeHtml(typeLabel) + '</span>' +
        '<span class="contract-updated">' + escapeHtml(updated) + '</span>' +
        '<span class="status-pill status-' + escapeHtml(d.status || "draft") + '">' + statusLabel + '</span>' +
        '<span class="contract-actions">' + actionsHtml + '</span>';

      var openBtn = row.querySelector('[data-act="open"]');
      if (openBtn) openBtn.addEventListener("click", function () { openContract(c.id, d); });
      var delBtn = row.querySelector('[data-act="delete"]');
      if (delBtn) delBtn.addEventListener("click", function () { pendingDeleteId = c.id; renderContractsList(); });
      var cancelBtn = row.querySelector('[data-act="cancel-delete"]');
      if (cancelBtn) cancelBtn.addEventListener("click", function () { pendingDeleteId = null; renderContractsList(); });
      var confirmBtn = row.querySelector('[data-act="confirm-delete"]');
      if (confirmBtn) confirmBtn.addEventListener("click", function () { deleteContract(c.id); });

      listEl.appendChild(row);
    });
  }

  function openContract(id, d) {
    if (!TEMPLATES[d.templateId]) {
      currentTemplateId = null;
      setView("form");
      showStatus("error", "Kunde inte öppna avtalet: okänd avtalstyp (" + escapeHtml(d.templateId || "") + ").");
      return;
    }
    currentContractId = id;
    currentContractCreatedAt = d.createdAt || null;
    activateTemplateForm(d.templateId);
    populateForm(d.data || {});
    setView("form");
  }

  function deleteContract(id) {
    claudeUse("db").then(function (db) {
      if (!db) return;
      return db.doc("contracts/" + id).delete().then(function () {
        if (currentContractId === id) {
          currentContractId = null;
          currentContractCreatedAt = null;
        }
        cachedContracts = cachedContracts.filter(function (c) { return c.id !== id; });
        pendingDeleteId = null;
        renderContractsList();
      });
    }).catch(function (err) {
      pendingDeleteId = null;
      renderContractsList();
      showStatus("error", "Kunde inte ta bort avtalet: " + escapeHtml(errMsg(err)));
    });
  }

  document.getElementById("generateBtn").addEventListener("click", function () { runGenerate(false); });
  document.getElementById("exampleBtn").addEventListener("click", fillWithSampleData);
  document.getElementById("saveDraftBtn").addEventListener("click", showSavePanel);
  document.getElementById("confirmSaveBtn").addEventListener("click", confirmSaveDraft);
  document.getElementById("cancelSaveBtn").addEventListener("click", hideSavePanel);
  document.getElementById("tabFormBtn").addEventListener("click", function () { setView("form"); });
  document.getElementById("tabListBtn").addEventListener("click", function () { setView("list"); });
  document.getElementById("newContractBtn").addEventListener("click", newContract);
  document.getElementById("switchTemplateBtn").addEventListener("click", switchTemplate);

  // ---- build the template picker cards (Phase 3 of the roadmap) ----
  (function buildTemplatePicker() {
    var pickerEl = document.getElementById("templatePicker");
    Object.keys(TEMPLATES).forEach(function (id) {
      var t = TEMPLATES[id];
      var card = document.createElement("div");
      card.className = "template-card";
      var h3 = document.createElement("h3");
      h3.textContent = t.name;
      var p = document.createElement("p");
      p.className = "footnote";
      p.textContent = t.description;
      var btn = document.createElement("button");
      btn.className = "btn-secondary";
      btn.type = "button";
      btn.textContent = "Välj";
      btn.addEventListener("click", function () { selectTemplate(id); });
      card.appendChild(h3);
      card.appendChild(p);
      card.appendChild(btn);
      pickerEl.appendChild(card);
    });
  })();

  setView("form");
})();
</script>
