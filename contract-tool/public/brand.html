<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Varumärkesprofil</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <nav>
      <a href="index.html">&larr; Nytt avtal</a> ·
      <a href="new-template-contract.html">Nytt avtal från mall</a> ·
      <a href="templates.html">Kontraktsmallar</a>
    </nav>
    <h1>Varumärkesprofil</h1>
    <p>Gäller för alla kontrakts-PDF:er som genereras av verktyget.</p>

    <fieldset>
      <legend>Logotyp</legend>
      <img id="logo-preview" alt="Ingen logga uppladdad" />
      <label>Ladda upp logga (PNG, JPG eller SVG, max 2 MB)
        <input type="file" id="logo-file" accept="image/png,image/jpeg,image/svg+xml" />
      </label>
      <div id="logo-status"></div>
    </fieldset>

    <form id="brand-form">
      <fieldset>
        <legend>Färger</legend>
        <label>Primärfärg <input name="colors.primary" type="color" required /></label>
        <label>Sekundärfärg <input name="colors.secondary" type="color" required /></label>
      </fieldset>

      <fieldset>
        <legend>Typsnitt</legend>
        <label>
          Typsnitt
          <select name="font">
            <option value="helvetica">Helvetica</option>
            <option value="helvetica-bold">Helvetica (fet)</option>
            <option value="times">Times</option>
            <option value="courier">Courier</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Layout</legend>
        <label>Logotypens placering
          <select name="layout.logoPosition">
            <option value="left">Vänster</option>
            <option value="center">Centrerad</option>
            <option value="right">Höger</option>
          </select>
        </label>

        <div class="margin-grid">
          <label>Marginal topp (pt) <input name="layout.margins.top" type="number" min="0" max="200" required /></label>
          <label>Marginal botten (pt) <input name="layout.margins.bottom" type="number" min="0" max="200" required /></label>
          <label>Marginal vänster (pt) <input name="layout.margins.left" type="number" min="0" max="200" required /></label>
          <label>Marginal höger (pt) <input name="layout.margins.right" type="number" min="0" max="200" required /></label>
        </div>

        <label><input name="layout.header.enabled" type="checkbox" /> Visa sidhuvudstext</label>
        <label>Sidhuvudstext <input name="layout.header.text" maxlength="200" /></label>

        <label><input name="layout.footer.enabled" type="checkbox" /> Visa sidfotstext</label>
        <label>Sidfotstext <input name="layout.footer.text" maxlength="200" /></label>
      </fieldset>

      <button type="submit">Spara profil</button>
    </form>

    <div id="result"></div>
  </main>

  <script src="brand.js"></script>
</body>
</html>
